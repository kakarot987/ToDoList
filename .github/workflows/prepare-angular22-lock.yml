name: Regenerate Angular 22 lockfile on the dedicated upgrade branch
on:
  push:
    branches: [maintenance/angular22-coordinated-20261117]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve compatible dependency versions without install scripts
        working-directory: todo-list-frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate reproducible dependency installation
        working-directory: todo-list-frontend
        run: |
          node scripts/check-angular-lock.cjs
          npm ci --no-audit --no-fund
          npm run build -- --configuration production
      - name: Commit generated lockfile after successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add todo-list-frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: regenerate Angular 22 lockfile after successful build'
          git -c http.extraheader= push "https://x-access-token:${GH_TOKEN}@github.com/kakarot987/ToDoList.git" HEAD:maintenance/angular22-coordinated-20261117
