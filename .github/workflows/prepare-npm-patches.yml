name: Prepare npm patch updates
on:
  push:
    branches: [maintenance/npm-transitive-security-20261117]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Update npm lock within existing semver constraints
        working-directory: todo-list-frontend
        run: |
          npm install -g npm@11
          npm update --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate Angular peers, clean install and production build
        working-directory: todo-list-frontend
        run: |
          node scripts/check-angular-lock.cjs
          npm ci --no-audit --no-fund
          npm run build -- --configuration production
      - name: Commit only validated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add todo-list-frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: refresh npm lockfile within compatible semver ranges'
          git push "https://x-access-token:${GH_TOKEN}@github.com/kakarot987/ToDoList.git" HEAD:maintenance/npm-transitive-security-20261117
