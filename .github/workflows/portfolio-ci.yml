name: Full-stack regression and Docker smoke
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: todoList-spring-boot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test task service and controller code
        run: gradle --no-daemon test --tests '*ToDoServiceTests'
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: todo-list-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: todo-list-frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration production
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable database passwords
        run: cp .env.example .env
      - name: Validate Docker Compose syntax
        run: docker compose config -q
      - name: Build and start isolated stack
        run: docker compose up --build -d
      - name: Exercise CRUD via the Nginx API proxy
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:4200/api/todos >/tmp/todos.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "Timed out waiting for Nginx -> Spring Boot -> MySQL"
            docker compose ps
            exit 1
          fi
          python3 -c 'import json; assert isinstance(json.load(open("/tmp/todos.json")), list)'
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d '{"taskName":"CI smoke task","label":"ci","status":"PENDING"}' \
            http://127.0.0.1:4200/api/todos >/tmp/created-task.json
          id=$(python3 -c 'import json; d=json.load(open("/tmp/created-task.json")); assert d["taskName"] == "CI smoke task"; print(d["id"])')
          curl --fail --silent --show-error -X PUT -H 'Content-Type: application/json' \
            -d '{"taskName":"CI smoke updated","label":"ci","status":"DONE"}' \
            "http://127.0.0.1:4200/api/todos/$id" >/tmp/updated-task.json
          python3 -c 'import json; d=json.load(open("/tmp/updated-task.json")); assert d["status"] == "DONE"'
          curl --fail --silent --show-error -X DELETE "http://127.0.0.1:4200/api/todos/$id"
          curl --fail --silent --show-error http://127.0.0.1:4200/api/todos >/tmp/after-delete.json
          TASK_ID="$id" python3 -c 'import json,os; assert all(str(x["id"]) != os.environ["TASK_ID"] for x in json.load(open("/tmp/after-delete.json")))'
      - name: Show service status on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 80
      - name: Clean disposable containers and volume
        if: always()
        run: docker compose down -v
