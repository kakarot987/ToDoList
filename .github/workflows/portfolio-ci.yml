name: Todo backend regression tests and Angular build
on:
  push:
    branches: [master, "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todoList-spring-boot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test CRUD service behavior
        run: gradle --no-daemon test --tests '*ToDoServiceTests'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-list-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: todo-list-frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration production
